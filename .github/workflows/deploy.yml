name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: SSH vào VPS và deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            git fetch origin main
            git reset --hard origin/main
            if [ -f .env ] && [ ! -f Backend/.env ]; then
              mkdir -p Backend
              mv .env Backend/.env
              echo "📦 Đã tự động chuyển .env vào Backend/.env"
            fi
            cd Backend && npm install --omit=dev && cd ..
            cd Frontend/Web && npm install && npm run build && cd ../..
            pm2 delete anhai-backend 2>/dev/null || true
            pm2 start server.js --name anhai-backend --cwd ${{ secrets.VPS_APP_DIR }}/Backend
            pm2 save
            echo "✅ Deploy xong: $(date)"
